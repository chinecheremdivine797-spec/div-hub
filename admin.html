<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIV SUPPORT Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#080b12;color:#fff}.wrap{max-width:900px;margin:45px auto;padding:22px}.card{background:#111620;border:1px solid #28303e;border-radius:22px;padding:28px;margin-bottom:18px}input{width:100%;padding:14px;margin:8px 0 14px;background:#090d14;color:#fff;border:1px solid #394253;border-radius:10px}button,a{padding:13px 18px;border-radius:11px;border:0;font-weight:800;cursor:pointer}button{background:#fff;color:#080b12}.danger{background:#252b37;color:#fff}.hidden{display:none}.muted{color:#aab2c0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.error{color:#ff8e8e}.success{color:#a8f0b4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.donation{padding:12px 0;border-bottom:1px solid #29303b}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><h1>DIV SUPPORT Admin</h1><a href="index.html">Public site</a></div><div id="login" class="card"><h2>Private admin login</h2><p class="muted">Sign in with the authorized DIV SUPPORT admin account.</p><input id="email" type="email" placeholder="Admin email" value="divstudio03@gmail.com"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Log in</button><p id="err" class="error"></p></div><div id="panel" class="hidden"><div class="card"><div class="top"><div><h2>Support settings</h2><p class="muted">Changes are stored in Supabase and immediately become available on the public site.</p></div><button class="danger" onclick="logout()">Log out</button></div><div class="grid"><div><label>OPay account name</label><input id="opay_name"></div><div><label>OPay account number</label><input id="opay_number"></div><div><label>Bank name</label><input id="bank_name"></div><div><label>Bank account name</label><input id="bank_account_name"></div><div><label>Bank account number</label><input id="bank_account_number"></div><div><label>Fundraising goal (₦)</label><input id="fundraising_goal" type="number" min="1"></div></div><button onclick="saveSettings()">Save all settings</button><p id="saved" class="success"></p></div><div class="card"><div class="top"><h2>Donation records</h2><button onclick="loadDonations()">Refresh</button></div><p class="muted">Confirm a donation after you have verified the transfer.</p><div id="donations">Loading…</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB_URL='https://iyoxcubcxgywybkufjab.supabase.co';const SB_KEY='sb_publishable_lOk4ZiVjiV4inQhndmxxJw_-zAnmyGq';const sb=window.supabase.createClient(SB_URL,SB_KEY);function el(id){return document.getElementById(id)}async function login(){el('err').textContent='';const {data,error}=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('pass').value});if(error){el('err').textContent=error.message;return}if(data.user?.email!=='divstudio03@gmail.com'){await sb.auth.signOut();el('err').textContent='This account is not authorized.';return}el('login').classList.add('hidden');el('panel').classList.remove('hidden');await loadSettings();await loadDonations()}async function loadSettings(){const {data,error}=await sb.from('support_settings').select('*').eq('id',1).single();if(error){el('err').textContent=error.message;return}el('opay_name').value=data.opay_name||'';el('opay_number').value=data.opay_number||'';el('bank_name').value=data.bank_name||'';el('bank_account_name').value=data.bank_account_name||'';el('bank_account_number').value=data.bank_account_number||'';el('fundraising_goal').value=data.fundraising_goal||150000}async function saveSettings(){el('saved').textContent='';const {error}=await sb.from('support_settings').update({opay_name:el('opay_name').value.trim(),opay_number:el('opay_number').value.trim(),bank_name:el('bank_name').value.trim(),bank_account_name:el('bank_account_name').value.trim(),bank_account_number:el('bank_account_number').value.trim(),fundraising_goal:Number(el('fundraising_goal').value),updated_at:new Date().toISOString()}).eq('id',1);el('saved').textContent=error?error.message:'Settings saved successfully.'}async function loadDonations(){const box=el('donations');const {data,error}=await sb.from('support_donations').select('*').order('created_at',{ascending:false}).limit(50);if(error){box.textContent=error.message;return}if(!data?.length){box.textContent='No support records yet.';return}box.innerHTML=data.map(d=>`<div class="donation"><b>₦${(Number(d.amount_kobo)/100).toLocaleString('en-NG')}</b> — ${escapeHtml(d.supporter_name||'Anonymous')} — <span>${d.status}</span><br><small class="muted">${new Date(d.created_at).toLocaleString('en-NG')} ${d.message?' • '+escapeHtml(d.message):''}</small>${d.status==='pending'?`<br><button onclick="confirmDonation(${d.id})">Confirm donation</button>`:''}</div>`).join('')}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function confirmDonation(id){const {error}=await sb.from('support_donations').update({status:'confirmed'}).eq('id',id);if(error)alert(error.message);await loadDonations()}async function logout(){await sb.auth.signOut();location.reload()}sb.auth.getSession().then(({data})=>{if(data.session&&data.session.user.email==='divstudio03@gmail.com'){el('login').classList.add('hidden');el('panel').classList.remove('hidden');loadSettings();loadDonations()}});</script></body></html>
