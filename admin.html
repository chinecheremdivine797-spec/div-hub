<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIVSTUDIO Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#080b12;color:#fff}.wrap{max-width:620px;margin:60px auto;padding:22px}.card{background:#111620;border:1px solid #28303e;border-radius:22px;padding:28px;margin-bottom:18px}input{width:100%;padding:14px;margin:8px 0 14px;background:#090d14;color:#fff;border:1px solid #394253;border-radius:10px}button,a{padding:13px 18px;border-radius:11px;border:0;font-weight:800;cursor:pointer}button{background:#fff;color:#080b12}.danger{background:#252b37;color:#fff}.hidden{display:none}.muted{color:#aab2c0}.top{display:flex;justify-content:space-between;align-items:center}.error{color:#ff8e8e}</style></head><body><div class="wrap"><div class="top"><h1>DIVSTUDIO Admin</h1><a href="index.html">Public site</a></div><div id="login" class="card"><h2>Private login</h2><p class="muted">Demo admin gate for the initial static build. Before launch, replace this with Supabase Auth.</p><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Log in</button><p id="err" class="error"></p></div><div id="panel" class="hidden"><div class="card"><div class="top"><h2>Payment details</h2><button class="danger" onclick="logout()">Log out</button></div><label>OPay account name</label><input id="name"><label>OPay account number</label><input id="number"><label>Bank name</label><input id="bank"><button onclick="save()">Save payment details</button><p id="saved" class="muted"></p></div><div class="card"><h2>Fundraising goal</h2><input id="goal" type="number" min="1" placeholder="Target amount in ₦"><button onclick="saveGoal()">Save goal</button></div></div></div><script>const KEY='divAdminLogged';function login(){let e=email.value.trim(),p=pass.value; if(e==='divstudio03@gmail.com'&&p==='CHANGE-THIS-PASSWORD'){sessionStorage.setItem(KEY,'1');show()}else err.textContent='Incorrect admin login. Change the password in the source before production.'}function show(){loginBox();let s=JSON.parse(localStorage.getItem('divSupportSettings')||'{}');name.value=s.opayName||'DIVSTUDIO';number.value=s.opayNumber||'';bank.value=s.bank||'';goal.value=s.goal||''}function loginBox(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden')}function save(){let s=JSON.parse(localStorage.getItem('divSupportSettings')||'{}');s.opayName=name.value;s.opayNumber=number.value;s.bank=bank.value;localStorage.setItem('divSupportSettings',JSON.stringify(s));saved.textContent='Saved on this browser. Production version should store this in Supabase.'}function saveGoal(){let s=JSON.parse(localStorage.getItem('divSupportSettings')||'{}');s.goal=goal.value;localStorage.setItem('divSupportSettings',JSON.stringify(s))}function logout(){sessionStorage.removeItem(KEY);location.reload()}if(sessionStorage.getItem(KEY)==='1')show();</script></body></html>
